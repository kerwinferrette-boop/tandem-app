name: Doctrine & Ship Gate

# Makes the Notion source-of-truth un-bypassable: every PR and every push to main
# must pass the doctrine-conformance gate (scripts/doctrine.mjs, see /DOCTRINE.md)
# plus the full behavioral ship gate and the persona matrix. Code that drifts from
# the doctrine — re-rolling lifts weekly, dropping a required deload/superset,
# inventing a non-canonical goal — fails here and cannot merge.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. actions/checkout defaults to a
      # SHALLOW clone (depth 1), which has no commit graph — and verify's BUG-246
      # merge-parity check reads the graph (every merge against its parents' trees)
      # precisely because a file in the tree can be reverted and history cannot.
      # On a shallow clone that check finds zero merge commits and FAILS CLOSED,
      # which is what it should do rather than report a vacuous pass. Shipped on
      # 2026-11-09 after exactly that: the gate was verified only in a full clone,
      # went green locally, and turned main red on its first CI run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # Most gates are pure Node built-ins, but verify check #14 (BUG-128
      # bottom-nav pin smoke) drives a real browser via Playwright — install
      # deps + chromium or that check dies with ERR_MODULE_NOT_FOUND.
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Ship gate + doctrine conformance
        run: npm run verify
      - name: Persona / SKU matrix (504 combos, Rules 6-9)
        run: npm run validate:personas
