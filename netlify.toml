[build]
  command = "mkdir -p _site && cp tandem.html _site/index.html && cp -r public _site/ 2>/dev/null || true"
  publish = "_site"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
